name: Skill workflow smoke
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'sv2cli[audio] @ git+https://github.com/White-Wolf-233/sv2cli.git'
      - run: python tests/smoke.py
